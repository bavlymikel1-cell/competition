<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one narrow column. Login first, then a ranking table (rank | name | 3 categories | total) that opens into per-child detail; servants get the point form inside the opened row. */
:root{
  --bg:#f2f4f8;--surface:#ffffff;--panel:#f6f8fb;--fg:#17202f;--muted:#5a6578;--line:#dce2eb;
  --brand:#1f3a68;--brand-fg:#ffffff;--gold:#8a5a00;--gold-bg:#fbf0d4;
  --good:#14663f;--good-bg:#e0f3e8;--bad:#a63a2a;--bad-bg:#fbe6e2;
  --f-body:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;
  --f-disp:'Reem Kufi','Cairo',system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1622;--surface:#172134;--panel:#121b2b;--fg:#e8edf5;--muted:#9aa7bb;--line:#2a3750;
    --brand:#8db2f0;--brand-fg:#0d1522;--gold:#e3b45c;--gold-bg:#3a2f17;
    --good:#5fd09a;--good-bg:#15352a;--bad:#f08a78;--bad-bg:#3b1f1b;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1622;--surface:#172134;--panel:#121b2b;--fg:#e8edf5;--muted:#9aa7bb;--line:#2a3750;
  --brand:#8db2f0;--brand-fg:#0d1522;--gold:#e3b45c;--gold-bg:#3a2f17;
  --good:#5fd09a;--good-bg:#15352a;--bad:#f08a78;--bad-bg:#3b1f1b;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#root{max-width:680px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:34px;height:34px;flex:none;color:var(--brand)}
h1{font-family:var(--f-disp);font-size:26px;line-height:1.2;margin:0;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
#who{display:flex;align-items:center;gap:8px;flex:none}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--gold-bg);color:var(--gold)}
.btn{min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-fg);font-weight:700}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.small{min-height:36px;padding:4px 12px;font-size:13px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.dangerline{background:transparent;color:var(--bad);border-color:var(--bad)}
.muted{color:var(--muted)}
h2{font-family:var(--f-disp);font-size:22px;margin:0 0 4px}
h3{font-size:14px;margin:18px 0 8px;color:var(--muted);font-weight:700}

/* login */
.login{max-width:460px;margin:28px auto 0;text-align:center}
.lead{color:var(--muted);margin:0 0 20px}
.roles{display:grid;gap:12px}
.role{display:flex;flex-direction:column;gap:2px;align-items:center;padding:20px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.role strong{font-family:var(--f-disp);font-size:22px}
.role span{color:var(--muted);font-size:13px}
.role:hover{border-color:var(--brand)}
.pwform{display:grid;gap:12px;text-align:start}
.pwform label{font-weight:700}
.field{width:100%;min-height:46px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
textarea.field{min-height:120px;resize:vertical}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.err{color:var(--bad);font-weight:600;margin:0}

/* toolbar */
#tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
#tools input{flex:1 1 200px}

/* my card */
.mycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.mycard .k{font-size:12px;color:var(--muted);font-weight:700}
.myhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:2px 0 10px}
.bigrank{font-family:var(--f-disp);font-size:40px;line-height:1;color:var(--gold);font-weight:700}
.myname{font-size:18px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.mytot{margin-inline-start:auto;font-size:14px;color:var(--muted)}
.mytot b{font-size:22px;color:var(--brand)}

/* list */
.head,.row{display:grid;grid-template-columns:32px minmax(0,1fr) repeat(4,44px) 50px;gap:6px;align-items:center}
.head{padding:0 12px 6px;font-size:11px;color:var(--muted);font-weight:700;text-align:center}
.head span:nth-child(2){text-align:start}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item+.item{border-top:1px solid var(--line)}
.item.mine{background:var(--gold-bg)}
.row{width:100%;text-align:start;background:none;border:0;padding:10px 12px;min-height:54px}
.row:hover{background:var(--panel)}
.rk{font-family:var(--f-disp);font-weight:700;text-align:center;color:var(--muted);font-size:17px}
.rk1{color:var(--gold);font-size:20px}
.nm{font-weight:600;overflow-wrap:anywhere;min-width:0}
.me{font-style:normal;font-size:11px;font-weight:700;margin-inline-start:6px;padding:1px 7px;border-radius:99px;background:var(--brand);color:var(--brand-fg)}
.num{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.num.has{color:var(--good);font-weight:700}
.tot{text-align:center;font-weight:800;font-size:17px;color:var(--brand);font-variant-numeric:tabular-nums}
.detail{padding:6px 14px 18px;background:var(--panel);border-top:1px dashed var(--line)}
.cats{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.cats li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.cv{font-weight:700;font-variant-numeric:tabular-nums;min-width:28px;text-align:center}
.chip{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.none{background:var(--bad-bg);color:var(--bad)}
.actions{margin-top:12px}

/* servant form */
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.seg,.quick{display:flex;gap:8px;flex-wrap:wrap}
.seg-b,.q{min-height:44px;padding:6px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.q{min-width:48px;padding:6px 10px}
.seg-b[aria-pressed="true"],.q[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.form .field{margin-top:10px;max-width:220px}
.submit{margin-top:14px}
.msg{margin:12px 0 0;padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px}
.msg.ok{background:var(--good-bg);color:var(--good)}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hist li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.hv{font-weight:800;font-variant-numeric:tabular-nums;min-width:36px}
.hv.pos{color:var(--good)}.hv.neg{color:var(--bad)}
.hd{color:var(--muted);font-size:12px}
.hist .sp{flex:1}
.manage{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.manage .field{flex:1 1 160px;margin:0;max-width:none}

/* add names */
.addbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.addbox p{margin:0 0 10px;color:var(--muted);font-size:14px}

.sbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.lbl.sep{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line)}
.bulkbar{align-items:center;margin:14px 0 10px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:360px;overflow-y:auto}
.chk{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:start}
.chk:disabled{opacity:.6;cursor:default}
.chk[aria-pressed="true"]{border-color:var(--brand);background:var(--panel)}
.box{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:800;line-height:1;color:var(--brand-fg)}
.chk[aria-pressed="true"] .box{background:var(--brand);border-color:var(--brand)}
.cn{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.vrow{display:flex;align-items:center;gap:12px;margin-top:10px}
.vrow label{flex:1;font-weight:600}
.vrow .field{width:110px;margin:0}
.count{font-size:13px;color:var(--muted);margin:0 2px 8px}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.skel{height:54px;border-bottom:1px solid var(--line);background:var(--panel)}
.note{font-size:13px;color:var(--gold);background:var(--gold-bg);padding:8px 12px;border-radius:10px;margin-bottom:12px}
/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.qcard h3{margin:0 0 10px;font-size:16px;color:var(--fg)}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;min-height:46px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:start}
.opt[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.opt.right{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.opt:disabled{cursor:default}
.scorebox{text-align:center;padding:18px;border-radius:var(--r);background:var(--gold-bg);color:var(--gold);margin-bottom:14px}
.scorebox b{display:block;font-family:var(--f-disp);font-size:40px;line-height:1.2}
.qrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qrow .qt{flex:1 1 160px;min-width:0;font-weight:700;overflow-wrap:anywhere}
.qbanner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--gold-bg);color:var(--gold);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-weight:700}
.qbanner .btn{background:var(--gold);border-color:var(--gold);color:var(--surface)}
@media (max-width:420px){
  h1{font-size:22px}
  .head,.row{grid-template-columns:24px minmax(0,1fr) repeat(4,33px) 40px;gap:3px;padding-inline:8px}
  .head{font-size:10px}
}
</style>

<div id="root" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg>
      <div>
        <h1>نقاط الفصل</h1>
        <p class="sub">مدارس الأحد والاعتراف والقداس والإنجيل</p>

    <div id="who"></div>

  <div id="tools" hidden>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== الصق هنا إعدادات Firebase بتاعتك (شوف ملف الشرح) ===== */
var FIREBASE_CONFIG={"apiKey": "AIzaSyCrYNGKg5GyTjBE-1osX42B9XPOxK7gOdc", "authDomain": "nokat-elfasl.firebaseapp.com", "projectId": "nokat-elfasl", "storageBucket": "nokat-elfasl.firebasestorage.app", "messagingSenderId": "604300426454", "appId": "1:604300426454:web:ced51255dd191a63c2dd77"};
/* =============================================================== */
(function(){
'use strict';

var CATS=[
  {id:'sunday',label:'حضور مدارس الأحد',short:'مدارس'},
  {id:'confession',label:'الاعتراف',short:'اعتراف'},
  {id:'mass',label:'حضور القداس',short:'قداس'},
  {id:'gospel',label:'الإنجيل',short:'إنجيل'}
];
var CAT_IDS={confession:1,mass:1,sunday:1,gospel:1};
var PASS_HASH='a54e71f0e17f5aaf7946e66ab42cf3b1fd4e61d60581736c9f0eb1c3f794eb7c';
var MAX_AMT=100;

function $(s){return document.querySelector(s);}
function store(kind){try{return window[kind];}catch(e){return null;}}
function sget(kind,k){try{var s=store(kind);return s?s.getItem(k):null;}catch(e){return null;}}
function sset(kind,k,v){try{var s=store(kind);if(!s)return;if(v==null)s.removeItem(k);else s.setItem(k,v);}catch(e){}}

var savedRole=sget('sessionStorage','role');
var S={
  db:null,dbChecked:false,err:null,slow:false,
  have:{kids:false,points:false},fresh:{kids:false,points:false},
  kids:[],points:[],
  role:(savedRole==='servant'||savedRole==='kid')?savedRole:null,
  myKid:sget('localStorage','myKid'),
  step:'choose',pwErr:'',fails:0,lockUntil:0,checking:false,focusPw:false,
  open:null,q:'',
  form:{cat:'confession',sign:1,amt:''},
  msg:null,busy:false,confirm:null,rename:null,
  panel:null,addText:'',
  values:{sunday:10,confession:10,mass:5,gospel:10},draft:null,
  bulk:{cat:'sunday',sel:{}},idSet:{},
  quizzes:[],quizHave:false,quiz:null,qdraft:{title:'',per:'2',text:''}
};

/* ---------- helpers ---------- */
function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs){Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(v==null||v===false)return;
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);
  });}
  for(var i=2;i<arguments.length;i++){add(e,arguments[i]);}
  return e;
}
function add(e,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){add(e,x);});return;}
  e.append(c.nodeType?c:document.createTextNode(String(c)));
}
function norm(s){
  return String(s||'').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا')
    .replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase();
}
function catLabel(id){for(var i=0;i<CATS.length;i++){if(CATS[i].id===id)return CATS[i].label;}return id;}
function pad(n){return n<10?'0'+n:String(n);}
function fmt(ts){
  if(!ts)return '';
  var d=new Date(ts);
  return d.getDate()+'/'+(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function errText(e){
  var c=e&&e.code;
  if(c==='permission-denied')return 'قواعد الأمان في Firebase مش مفعّلة صح. راجع ملف الشرح.';
  if(c==='resource-exhausted')return 'المساحة أو الحد اليومي المجاني خلص.';
  if(c==='unavailable')return 'مفيش اتصال بالنت.';
  return 'حصلت مشكلة، جرّب تاني.';
}

/* ---------- data model ---------- */
function model(){
  var t={};
  S.kids.forEach(function(k){t[k.id]={confession:0,mass:0,sunday:0,gospel:0,total:0};});
  S.points.forEach(function(p){
    var r=t[p.kid];
    if(!r||!CAT_IDS[p.cat])return;
    r[p.cat]+=p.amt;r.total+=p.amt;
  });
  var rows=S.kids.map(function(k){return {kid:k,t:t[k.id]};});
  rows.sort(function(a,b){return b.t.total-a.t.total||a.kid.name.localeCompare(b.kid.name,'ar');});
  var prev=null,rank=0;
  rows.forEach(function(r,i){if(r.t.total!==prev){rank=i+1;prev=r.t.total;}r.rank=rank;});
  return rows;
}
function catTotal(kidId,cat){
  var s=0;
  S.points.forEach(function(p){if(p.kid===kidId&&p.cat===cat)s+=p.amt;});
  return s;
}

function todayKey(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function attId(day,cat,kid){return 'a_'+day+'_'+cat+'_'+kid;}
function valueOf(cat){var v=S.values[cat];return (isFinite(v)&&v>=1)?v:10;}

/* ---------- login ---------- */
async function sha256(s){
  try{
    if(window.crypto&&crypto.subtle){
      var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,'0');}).join('');
    }
  }catch(e){}
  return null;
}
async function tryServantLogin(value){
  if(S.checking)return;
  if(Date.now()<S.lockUntil){
    S.pwErr='جربت كذا مرة غلط. استنى نص دقيقة وجرّب تاني.';render();return;
  }
  S.checking=true;
  var v=String(value||'').trim().toLowerCase();
  var hex=await sha256(v);
  var ok=hex?hex===PASS_HASH:v===['je','sus'].join('');
  S.checking=false;
  if(ok){
    S.fails=0;S.pwErr='';setRole('servant');
  }else{
    S.fails++;
    if(S.fails>=5){S.lockUntil=Date.now()+30000;S.fails=0;S.pwErr='جربت كذا مرة غلط. استنى نص دقيقة وجرّب تاني.';}
    else S.pwErr='الباسورد غلط. لو انت مخدوم ارجع واختار «مخدوم».';
    S.focusPw=true;render();
  }
}
function setRole(r){
  S.role=r;S.step='choose';S.open=null;S.msg=null;S.confirm=null;S.rename=null;S.q='';S.quiz=null;
  var q=$('#q');if(q)q.value='';
  sset('sessionStorage','role',r);
  render();
}
function logout(){
  S.role=null;S.step='choose';S.open=null;S.msg=null;S.confirm=null;S.rename=null;S.pwErr='';S.q='';S.quiz=null;
  var q=$('#q');if(q)q.value='';
  sset('sessionStorage','role',null);
  render();
}
function loginView(){
  var box=h('section',{class:'login'});
  if(S.step==='servant'){
    box.append(h('h2',null,'دخول الخدام'),h('p',{class:'lead'},'اكتب الباسورد علشان نتأكد إنك خادم'));
    var input=h('input',{id:'pw',class:'field',type:'password',autocomplete:'off',autocapitalize:'off',placeholder:'الباسورد','aria-label':'الباسورد'});
    var form=h('form',{class:'pwform',onsubmit:function(e){e.preventDefault();tryServantLogin(input.value);}},
      input,
      S.pwErr?h('p',{class:'err',role:'alert'},S.pwErr):null,
      h('div',{class:'row2'},
        h('button',{type:'submit',class:'btn',disabled:S.checking},'دخول'),
        h('button',{type:'button',class:'btn ghost',onclick:function(){S.step='choose';S.pwErr='';render();}},'رجوع')));
    box.append(form);
  }else{
    box.append(h('h2',null,'أهلاً بيك'),h('p',{class:'lead'},'اختار انت مين'));
    box.append(h('div',{class:'roles'},
      h('button',{type:'button',class:'role',onclick:function(){setRole('kid');}},
        h('strong',null,'مخدوم'),h('span',null,'أشوف ترتيبي ونقاطي')),
      h('button',{type:'button',class:'role',onclick:function(){S.step='servant';S.pwErr='';S.focusPw=true;render();}},
        h('strong',null,'خادم'),h('span',null,'أضيف النقاط وأظبط الأسماء'))));
  }
  return box;
}

async function addNames(){
  if(S.busy)return;
  var existing={};S.kids.forEach(function(k){existing[norm(k.name)]=1;});
  var seen={},list=[],lines=0;
  S.addText.split(/\r?\n/).forEach(function(line){
    var n=line.replace(/^[\s\d٠-٩]+[\-.)–:]\s*/,'').replace(/\s+/g,' ').trim().slice(0,60);
    if(!n)return;
    lines++;
    var key=norm(n);
    if(existing[key]||seen[key])return;
    seen[key]=1;list.push(n);
  });
  if(!list.length){S.msg={t:'err',text:lines?'كل الأسماء دي موجودة قبل كده.':'اكتب اسم واحد على الأقل، كل اسم في سطر.'};render();return;}
  if(list.length>200){S.msg={t:'err',text:'أقصى عدد 200 اسم في المرة.'};render();return;}
  S.busy=true;S.msg=null;render();
  var ok=0;
  try{
    for(var i=0;i<list.length;i++){
      await S.db.collection('kids').add({name:list[i],ord:Date.now()+i});
      ok++;
    }
    S.addText='';
    var skipped=lines-list.length;
    S.msg={t:'ok',text:'اتضاف '+ok+' اسم'+(skipped?' (وفيه '+skipped+' موجود قبل كده)':'')+'.'};
  }catch(e){
    S.msg={t:'err',text:(ok?'اتضاف '+ok+' اسم بس. ':'')+errText(e)};
  }
  S.busy=false;render();
}

/* ---------- quizzes ---------- */
function quizById(id){for(var i=0;i<S.quizzes.length;i++){if(S.quizzes[i].id===id)return S.quizzes[i];}return null;}
function quizPointId(qid,kid){return 'q_'+qid+'_'+kid;}
function attempts(qid){var n=0;S.points.forEach(function(p){if(p.id.indexOf('q_'+qid+'_')===0)n++;});return n;}
function parseQuiz(text){
  var blocks=String(text||'').split(/\r?\n\s*\r?\n/),qs=[],err=null;
  blocks.forEach(function(b){
    if(err)return;
    var lines=b.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
    if(!lines.length)return;
    var n=qs.length+1,opts=[],correct=-1,many=false;
    lines.slice(1).forEach(function(l){
      var c=l.charAt(0)==='*';
      if(c)l=l.slice(1).trim();
      if(!l)return;
      if(c){if(correct>-1)many=true;else correct=opts.length;}
      opts.push(l.slice(0,120));
    });
    if(opts.length<2||opts.length>6)err='سؤال '+n+': لازم يكون له من 2 لـ 6 اختيارات.';
    else if(correct<0)err='سؤال '+n+': علّم الإجابة الصح بنجمة * في أولها.';
    else if(many)err='سؤال '+n+': فيه أكتر من إجابة صح، علّم واحدة بس.';
    else qs.push({q:lines[0].slice(0,300),o:opts,c:correct});
  });
  if(!err&&!qs.length)err='اكتب سؤال واحد على الأقل.';
  if(!err&&qs.length>50)err='أقصى عدد 50 سؤال.';
  return {qs:qs,err:err};
}
async function createQuiz(){
  if(S.busy)return;
  var d=S.qdraft,title=String(d.title||'').replace(/\s+/g,' ').trim().slice(0,80);
  var per=parseInt(d.per,10);
  if(!title){S.msg={t:'err',text:'اكتب اسم المسابقة.'};render();return;}
  if(!isFinite(per)||per<1||per>MAX_AMT){S.msg={t:'err',text:'نقاط كل إجابة صح من 1 إلى '+MAX_AMT+'.'};render();return;}
  var pq=parseQuiz(d.text);
  if(pq.err){S.msg={t:'err',text:pq.err};render();return;}
  S.busy=true;S.msg=null;render();
  try{
    await S.db.collection('quizzes').add({title:title,per:per,qs:pq.qs,active:true,ts:Date.now()});
    S.qdraft={title:'',per:String(per),text:''};
    S.msg={t:'ok',text:'اتعملت المسابقة وبقت شغالة. الولاد هيلاقوها فوق في الصفحة.'};
  }catch(e){S.msg={t:'err',text:errText(e)};}
  S.busy=false;render();
}

async function submitQuiz(qz){
  if(S.busy||!S.quiz||!S.quiz.kid)return;
  var kid=S.quiz.kid,id=quizPointId(qz.id,kid);
  if(S.idSet[id]){S.msg={t:'err',text:'الاسم ده حلّ المسابقة قبل كده.'};S.quiz.step='name';render();return;}
  var score=0;
  qz.qs.forEach(function(x,i){if(S.quiz.ans[i]===x.c)score++;});
  var pts=score*qz.per;
  S.busy=true;S.msg=null;render();
  try{
    await S.db.collection('points').doc(id).set({kid:kid,cat:'gospel',amt:pts,ts:Date.now(),day:todayKey(),quiz:qz.id});
    S.quiz.res={score:score,total:qz.qs.length,pts:pts};
    S.quiz.step='done';
    window.scrollTo(0,0);
  }catch(e){S.msg={t:'err',text:errText(e)};}
  S.busy=false;render();
}

async function maybeSeed(){
  if(S.seeding||S.seedDone||S.role!=='servant'||!S.db||!S.fresh.kids||!S.fresh.points||S.kids.length||S.points.length)return;
  S.seeding=true;
  try{
    var meta=await S.db.doc('settings/meta').get();
    if(meta.exists){S.seedDone=true;S.seeding=false;return;}
    var bt=S.db.batch();
    Object.keys(SEED_DATA.kids).forEach(function(id){bt.set(S.db.collection('kids').doc(id),SEED_DATA.kids[id]);});
    Object.keys(SEED_DATA.points).forEach(function(id){bt.set(S.db.collection('points').doc(id),SEED_DATA.points[id]);});
    bt.set(S.db.doc('settings/meta'),{seeded:true,ts:Date.now()});
    await bt.commit();
    S.msg={t:'ok',text:'اتحمّلت أسماء الفصل ونقاطه.'};
  }catch(e){S.msg={t:'err',text:errText(e)};}
  S.seeding=false;S.seedDone=true;render();
}

async function init(){
  render();
  var db=null;
  try{
    if(window.firebase&&FIREBASE_CONFIG.projectId&&FIREBASE_CONFIG.projectId!=='PASTE_HERE'){
      firebase.initializeApp(FIREBASE_CONFIG);
      db=firebase.firestore();
    }
  }catch(e){db=null;}
  S.db=db;S.dbChecked=true;
  if(!db){render();return;}
  var timer=setTimeout(function(){S.slow=true;render();},10000);
  function mark(key,snap){
    S.have[key]=true;
    if(!snap.metadata.fromCache)S.fresh[key]=true;
    if(S.fresh.kids&&S.fresh.points){clearTimeout(timer);S.slow=false;}
  }
  function onErr(e){S.err=e||true;clearTimeout(timer);render();}
  db.collection('kids').onSnapshot(function(snap){
    S.kids=snap.docs.map(function(d){
      var x=d.data()||{};
      return {id:d.id,name:String(x.name==null?'':x.name).slice(0,60),ord:Number(x.ord)||0};
    }).filter(function(k){return k.name;});
    mark('kids',snap);render();
  },onErr);
  db.collection('points').onSnapshot(function(snap){
    S.points=snap.docs.map(function(d){
      var x=d.data()||{};
      var a=Number(x.amt);
      return {id:d.id,kid:String(x.kid||''),cat:String(x.cat||''),amt:isFinite(a)?Math.round(a):0,ts:Number(x.ts)||0};
    });
    S.idSet={};S.points.forEach(function(p){S.idSet[p.id]=1;});
    mark('points',snap);render();
  },onErr);
  db.collection('quizzes').onSnapshot(function(snap){
    S.quizzes=snap.docs.map(function(d){
      var x=d.data()||{};
      var qs=Array.isArray(x.qs)?x.qs.filter(function(q){return q&&Array.isArray(q.o)&&q.o.length>1;}):[];
      var per=Number(x.per);
      return {id:d.id,title:String(x.title||'مسابقة').slice(0,80),per:(isFinite(per)&&per>=1)?Math.round(per):1,qs:qs,active:x.active!==false,ts:Number(x.ts)||0};
    }).filter(function(q){return q.qs.length;}).sort(function(a,b){return b.ts-a.ts;});
    S.quizHave=true;render();
  },function(){});
  db.doc('settings/values').onSnapshot(function(snap){
    var x=snap.exists?snap.data():null;
    if(x){CATS.forEach(function(c){
      var n=Number(x[c.id]);
      if(isFinite(n)&&n>=1&&n<=MAX_AMT)S.values[c.id]=Math.round(n);
    });}
    render();
  },function(){});
}
